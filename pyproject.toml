[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slugany"
version = "0.1.0"
description = "Slugify multi-idioma, zero deps. Alternativa simple a python-slugify sin GPL."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Mathias Paulenko", email = "mathias.paulenko@outlook.com" }]
keywords = ["slugify", "slug", "unicode", "transliterate", "seo", "url", "multi-language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MathiasPaulenko/slugany"
Repository = "https://github.com/MathiasPaulenko/slugany"
"Bug Tracker" = "https://github.com/MathiasPaulenko/slugany/issues"
Changelog = "https://github.com/MathiasPaulenko/slugany/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]
pydantic = [
    "pydantic>=2.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
slugany = "slugany.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["slugany"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=slugany --cov-report=term-missing --cov-fail-under=100"
